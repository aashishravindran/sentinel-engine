name: release

# Push a tag like v0.2.0 on the `pypi` branch to publish sentinel-authz: test, build, install the
# built wheel, then upload. No API tokens:
# PyPI trusts this workflow through OIDC (Trusted Publishing) and attaches attestations.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      # Releases come only from the packaging branch, and the tag must match the version.
      - name: Check branch and version
        run: |
          git branch -r --contains "$GITHUB_SHA" | grep -qx '  origin/pypi' \
            || { echo "::error::$GITHUB_REF_NAME is not on the pypi branch"; exit 1; }
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          [ "v$version" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: uv sync --all-extras
      - run: uv run pytest -q
      - run: uv build
      - run: uvx twine@7.0.0 check --strict dist/*
      # Install the exact wheel that will be uploaded, in a clean environment outside the repo,
      # and import it: catches packaging mistakes before PyPI, where a version can't be re-used.
      - name: Install the built wheel
        run: |
          wheel="$(ls "$PWD"/dist/*.whl)"
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --python 3.12 --with "${wheel}[aws,sqlite]" \
            python -I -c "import sentinel_engine; from sentinel_engine import SentinelEngine; import importlib.metadata as m; print(m.version('sentinel-authz'))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
