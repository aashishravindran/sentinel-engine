name: release

# Push a tag like v0.2.0 on the `pypi` branch to publish sentinel-authz. No API tokens:
# PyPI trusts this workflow through OIDC (Trusted Publishing) and attaches attestations.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      # Releases come only from the packaging branch, and the tag must match the version.
      - name: Check branch and version
        run: |
          git branch -r --contains "$GITHUB_SHA" | grep -qx '  origin/pypi' \
            || { echo "::error::$GITHUB_REF_NAME is not on the pypi branch"; exit 1; }
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          [ "v$version" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: uv sync --all-extras
      - run: uv run pytest -q
      - run: uv build
      - run: uvx twine@7.0.0 check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      # Install what was just published, in a clean environment, before touching real PyPI.
      - name: Install from TestPyPI
        run: |
          version="${GITHUB_REF_NAME#v}"
          for i in 1 2 3 4 5 6; do
            uv run --isolated --no-project --python 3.12 \
              --index https://test.pypi.org/simple/ --index-strategy unsafe-best-match \
              --with "sentinel-authz[aws,sqlite]==$version" \
              python -c "import sentinel_engine; from sentinel_engine import SentinelEngine; print('ok')" \
              && exit 0
            sleep 20
          done
          exit 1

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
